name: Feature request
description: Propose a new mechanic, improvement or tooling change.
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be possible afterwards, and why does it matter for the game?
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: A checklist that tells us when the feature is done.
      placeholder: |
        - [ ] …
        - [ ] …
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Design notes
      description: Link the relevant section of docs/GameDesign.md, numbers, sketches.
